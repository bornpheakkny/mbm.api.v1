# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mbm-api-v1
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: DIRECT_URL
        sync: false # Neon direct connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # e.g. https://mbm-app-v1.vercel.app
      - key: ADMIN_EMAIL
        sync: false # root admin login, created on first start
      - key: ADMIN_PASSWORD
        sync: false # change it after first login
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_USERNAME
        value: admin
      - key: APP_URL
        sync: false # your Vercel URL, used in email links
      - key: BREVO_API_KEY
        sync: false # brevo.com -> SMTP & API -> API keys
      - key: EMAIL_FROM
        sync: false # a sender verified in Brevo, e.g. Budget Manager <you@gmail.com>
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false # Twilio number (+1...) or Messaging Service SID (MG...)
      - key: DEFAULT_PHONE_COUNTRY
        value: KH
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
